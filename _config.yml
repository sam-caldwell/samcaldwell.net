title: samcaldwell.net
description: "Sam Caldwell — Software engineering, security research, and DevOps/SRE based in Sonora, Texas."
url: https://samcaldwell.net
baseurl: ""
lang: en

# Keep the existing include
include: [".well-known"]

# Pretty URLs like /about/
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-gist

defaults:
  # Pages under pages/ get the page layout automatically
  - scope:
      path: "pages"
      type: "pages"
    values:
      layout: page
  # Pages under jokes/ act as joke posts
  - scope:
      path: "jokes"
      type: "pages"
    values:
      layout: page
  # Pages under dashboards/ act as dashboard entries
  - scope:
      path: "dashboards"
      type: "pages"
    values:
      layout: page
  # Pages under books/ act as book entries
  - scope:
      path: "books"
      type: "pages"
    values:
      layout: page
  # Blog posts use the same page layout (global template)
  - scope:
      path: ""
      type: "posts"
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
