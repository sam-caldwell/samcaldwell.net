title: samcaldwell.net
description: "Sam Caldwell — Software engineering, security research, and DevOps/SRE based in Sonora, Texas."
url: https://samcaldwell.net
baseurl: ""
lang: en

# Keep the existing include
include: [".well-known"]

# Pretty URLs like /about/
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  # Pages under pages/ get the page layout automatically
  - scope:
      path: "pages"
      type: "pages"
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
