version: 2
updates:
  # Keep Ruby gems (Jekyll + plugins) up to date
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep npm packages (Playwright) up to date
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Watch the Docker base image tags
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

