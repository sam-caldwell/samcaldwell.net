name: E2E Tests

on:
  deployment_status:

  # Allow manual trigger for debugging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Cloudflare bypass
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "X-CF-E2E-Bypass: ${CF_BYPASS_TOKEN}" \
            https://samcaldwell.net/)
          echo "HTTP status with bypass header: ${STATUS}"
          if [ "$STATUS" = "403" ]; then
            echo "::warning::Cloudflare bypass header not working — challenge still active (403)"
          fi
        env:
          CF_BYPASS_TOKEN: ${{ secrets.CF_BYPASS_TOKEN }}

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          CF_BYPASS_TOKEN: ${{ secrets.CF_BYPASS_TOKEN }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
